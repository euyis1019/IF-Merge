<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 372" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16233f"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6fab"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c8553d"/>
    </marker>
  </defs>
  <rect width="1040" height="372" rx="14" fill="#ffffff"/>

  <!-- inputs -->
  <g font-size="13" fill="#16233f">
    <rect x="24" y="64" width="150" height="62" rx="9" fill="#f6f1e4" stroke="#b79a45" stroke-width="1.3"/>
    <text x="99" y="90" text-anchor="middle" font-weight="600">Task experts</text>
    <text x="99" y="109" text-anchor="middle" font-size="12" fill="#5c5540">frozen, one per task</text>
    <rect x="24" y="150" width="150" height="62" rx="9" fill="#eef1f6" stroke="#8a94a8" stroke-width="1.3"/>
    <text x="99" y="176" text-anchor="middle" font-weight="600">Any merged model</text>
    <text x="99" y="195" text-anchor="middle" font-size="12" fill="#555d6e">WA, TA, TIES, Iso-CTS, …</text>
    <rect x="24" y="236" width="150" height="62" rx="9" fill="#ffffff" stroke="#8a94a8" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="99" y="262" text-anchor="middle" font-weight="600">Unlabeled inputs</text>
    <text x="99" y="281" text-anchor="middle" font-size="12" fill="#555d6e">256 + 256 per task</text>
  </g>
  <g stroke="#16233f" stroke-width="1.6" fill="none">
    <path d="M174 95 H216" marker-end="url(#arrow)"/>
    <path d="M174 181 H216" marker-end="url(#arrow)"/>
    <path d="M174 267 H216" marker-end="url(#arrow)"/>
  </g>

  <!-- loop frame -->
  <rect x="222" y="30" width="794" height="318" rx="14" fill="#fafbfd" stroke="#d5dae3" stroke-width="1.2"/>
  <text x="244" y="56" font-size="13" font-weight="700" fill="#16233f" letter-spacing="0.6">ONE ROUND OF IF-MERGE</text>
  <text x="994" y="56" font-size="12" fill="#555d6e" text-anchor="end">no labels · no gradient training</text>

  <!-- step 1 -->
  <g>
    <rect x="244" y="74" width="236" height="188" rx="10" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/>
    <circle cx="268" cy="100" r="12" fill="#16233f"/>
    <text x="268" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="290" y="105" font-size="15" font-weight="700" fill="#16233f">Measure both sides</text>
    <text x="262" y="132" font-size="12.5" fill="#555d6e">at the current merged model, per task</text>
    <rect x="262" y="146" width="200" height="46" rx="7" fill="#eaf2fa" stroke="#2f6fab" stroke-width="1.1"/>
    <text x="274" y="165" font-size="13" font-weight="700" fill="#2f6fab">A  activation statistics</text>
    <text x="274" y="183" font-size="12" fill="#2b4d70">inputs of each weight matrix</text>
    <rect x="262" y="202" width="200" height="46" rx="7" fill="#fbeeea" stroke="#c8553d" stroke-width="1.1"/>
    <text x="274" y="221" font-size="13" font-weight="700" fill="#c8553d">G  function-space feedback</text>
    <text x="274" y="239" font-size="12" fill="#7d382a">expert–merged KL gradients</text>
  </g>
  <path d="M480 168 H510" stroke="#16233f" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <g>
    <rect x="516" y="74" width="236" height="188" rx="10" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/>
    <circle cx="540" cy="100" r="12" fill="#16233f"/>
    <text x="540" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="562" y="105" font-size="15" font-weight="700" fill="#16233f">Fit every layer</text>
    <text x="534" y="132" font-size="12.5" fill="#555d6e">all weight matrices in parallel</text>
    <g font-size="13" fill="#16233f">
      <text x="534" y="166">each matrix moves toward the</text>
      <text x="534" y="185">expert weights, weighted by</text>
      <text x="534" y="204"><tspan fill="#2f6fab" font-weight="700">A</tspan> on its input side and</text>
      <text x="534" y="223"><tspan fill="#c8553d" font-weight="700">G</tspan> on its output side</text>
    </g>
    <text x="534" y="248" font-size="12" fill="#555d6e">conjugate gradient, 100 iterations</text>
  </g>
  <path d="M752 168 H782" stroke="#16233f" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <g>
    <rect x="788" y="74" width="206" height="188" rx="10" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/>
    <circle cx="812" cy="100" r="12" fill="#16233f"/>
    <text x="812" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="834" y="105" font-size="15" font-weight="700" fill="#16233f">Take one step</text>
    <text x="806" y="132" font-size="12.5" fill="#555d6e">a full-model update</text>
    <!-- step-size bars: holdout KL for each step size -->
    <g>
      <line x1="806" y1="212" x2="976" y2="212" stroke="#8a94a8" stroke-width="1"/>
      <rect x="812" y="160" width="20" height="52" fill="#c9cfda"/>
      <rect x="846" y="178" width="20" height="34" fill="#c9cfda"/>
      <rect x="880" y="192" width="20" height="20" fill="#16233f"/>
      <rect x="914" y="184" width="20" height="28" fill="#c9cfda"/>
      <rect x="948" y="170" width="20" height="42" fill="#c9cfda"/>
      <g font-size="11" fill="#555d6e" text-anchor="middle">
        <text x="822" y="227">0</text><text x="856" y="227">⅛</text><text x="890" y="227" fill="#16233f" font-weight="700">¼</text><text x="924" y="227">½</text><text x="958" y="227">1</text>
      </g>
      <text x="890" y="153" font-size="11" fill="#16233f" text-anchor="middle" font-weight="700">lowest</text>
    </g>
    <text x="806" y="248" font-size="12" fill="#555d6e">step size by holdout KL</text>
  </g>

  <!-- re-estimation loop -->
  <path d="M891 262 V302 Q891 312 881 312 H372 Q362 312 362 302 V270" stroke="#16233f" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="456" y="299" width="342" height="26" rx="13" fill="#fafbfd"/>
  <text x="627" y="317" font-size="13" fill="#16233f" text-anchor="middle"><tspan font-weight="700">Re-estimate</tspan> at the updated model · up to 4 rounds</text>
</svg>
